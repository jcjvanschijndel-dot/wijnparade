            <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="header-logo">
                    <div class="header-logo-box">
                        <img src="/logo.svg" alt="de_wijnparade">
                    </div>
                    <span class="header-logo-name">de_wijnparade</span>
                </a>
                <a href="https://www.instagram.com/de_wijnparade/" target="_blank" rel="noopener" class="ig-follow-btn" aria-label="Volg ons op Instagram" title="Instagram"><svg class="ig-logo" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="ig-grad" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#fdf497"/><stop offset=".05" stop-color="#fdf497"/><stop offset=".45" stop-color="#fd5949"/><stop offset=".6" stop-color="#d6249f"/><stop offset=".9" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig-grad)"/><rect x="5" y="5" width="14" height="14" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1.1" fill="#fff"/></svg></a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Intro Text -->
            <div class="page-intro-section" id="pageIntro">
                <p>Loading...</p>
            </div>
            
            <!-- Filters -->
            <div class="filters-section">
                <div class="filter-group">
                    <label>Kleur</label>
                    <select id="filterColor" class="filter-select">
                        <option value="">Alle</option>
                        <option value="Wit">Wit</option>
                        <option value="Rood">Rood</option>
                        <option value="Rosé">Rosé</option>
                        <option value="Sparkling">Sparkling</option>
                        <option value="Alcoholvrij">Alcoholvrij</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Gebied</label>
                    <select id="filterRegion" class="filter-select">
                        <option value="">Alle</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Land</label>
                    <select id="filterCountry" class="filter-select">
                        <option value="">Alle</option>
                    </select>
                </div>

                <button id="clearFilters" class="clear-btn">Wis filters</button>
            </div>

            <!-- Sort Controls -->
            <div class="sort-section">
                <label>Sorteer op:</label>
                <select id="sortBy" class="sort-select">
                    <option value="value_score">Value Score</option>
                    <option value="name">Naam</option>
                    <option value="producer">Producent</option>
                    <option value="region">Gebied</option>
                    <option value="country">Land</option>
                    <option value="price">Prijs</option>
                    <option value="rating">Gem. Rating</option>
                </select>
                <button id="sortOrder" class="sort-btn">↓</button>
            </div>

            <!-- Wine Cards (Mobile) -->
            <div class="wines-cards" id="winesCards"></div>

            <!-- Wine Table (Desktop) -->
            <div class="wines-table-wrapper">
                <table class="wines-table" id="winesTable">
                    <thead>
                        <tr>
                            <th data-sort="name">Naam</th>
                            <th data-sort="producer">Producent</th>
                            <th data-sort="region">Gebied</th>
                            <th data-sort="country">Land</th>
                            <th data-sort="color">Kleur</th>
                            <th data-sort="rating">Gem. Rating</th>
                            <th data-sort="price">Prijs</th>
                            <th data-sort="value_score">Value Score</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="winesTableBody"></tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Geen wijnen gevonden.</p>
            </div>
        </div>
    </main>
