backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "homepage"
    label: "Homepage Secties"
    files:
      - label: "Homepage Teksten"
        name: "sections"
        file: "content/homepage.json"
        fields:
          - {label: "Sectie 1 Tekst", name: "section1", widget: "string", default: "Toplijsten per gebied"}
          - {label: "Sectie 1 Emoji", name: "section1_icon", widget: "string", default: "📍"}
          - {label: "Sectie 2 Tekst", name: "section2", widget: "string", default: "Wijnparade favorieten"}
          - {label: "Sectie 2 Emoji", name: "section2_icon", widget: "string", default: "⭐"}
          - {label: "Sectie 3 Tekst", name: "section3", widget: "string", default: "Gerechten & wijn combi's"}
          - {label: "Sectie 3 Emoji", name: "section3_icon", widget: "string", default: "🍽️"}
          - {label: "Sectie 4 Tekst", name: "section4", widget: "string", default: "Wijnkaart"}
          - {label: "Sectie 4 Emoji", name: "section4_icon", widget: "string", default: "🗺️"}

  - name: "page_headers"
    label: "Pagina Headers"
    files:
      - label: "Toplijsten Pagina"
        name: "toplists_header"
        file: "content/headers/toplists.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Toplijsten per gebied"}
          - {label: "Intro Tekst", name: "intro", widget: "text", default: "Ontdek de beste wijnen per regio"}
      
      - label: "Favorieten Pagina"
        name: "favorites_header"
        file: "content/headers/favorites.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Wijnparade favorieten"}
          - {label: "Intro Tekst", name: "intro", widget: "text", default: "Onze persoonlijke aanraders"}
      
      - label: "Gerechten Pagina"
        name: "pairings_header"
        file: "content/headers/pairings.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Gerechten & wijn combi's"}
          - {label: "Intro Tekst", name: "intro", widget: "text", default: "Perfecte combinaties van eten en drinken"}
      
      - label: "Wijnkaart Pagina"
        name: "map_header"
        file: "content/headers/map.json"
        fields:
          - {label: "Titel", name: "title", widget: "string", default: "Wijnkaart"}
          - {label: "Intro Tekst", name: "intro", widget: "text", default: "Wijnbars, winkels en producenten op de kaart"}

  - name: "toplists"
    label: "Toplijsten"
    folder: "content/toplists"
    create: true
    slug: "{{fields.title}}"
    identifier_field: title
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Emoji/Icon", name: "icon", widget: "string", default: "🍷"}
      - label: "Type Link"
        name: "link_type"
        widget: "select"
        options: ["URL", "Bestand"]
        default: "URL"
      - {label: "URL (Google Sheets, externe link)", name: "url", widget: "string", required: false, hint: "Alleen invullen als Type Link = URL"}
      - {label: "Bestand (PDF/Excel)", name: "file", widget: "file", required: false, hint: "Alleen uploaden als Type Link = Bestand"}
      - {label: "Volgorde", name: "order", widget: "number", default: 0}

  - name: "favorites"
    label: "Favorieten (Wijnen)"
    folder: "content/favorites"
    create: true
    slug: "{{fields.name}}"
    identifier_field: name
    fields:
      - {label: "Wijn Naam", name: "name", widget: "string"}
      - {label: "Producent", name: "producer", widget: "string"}
      - {label: "Regio", name: "region", widget: "string"}
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Wit", "Rood", "Rosé", "Sparkling", "Alcoholvrij"]
      - {label: "Omschrijving", name: "description", widget: "text"}
      - {label: "Prijs (€)", name: "price", widget: "number", value_type: "float", step: 0.01}
      - {label: "Verkoopadres", name: "store", widget: "string", hint: "Bijv. Gall & Gall, Albert Heijn, online"}
      - {label: "Volgorde", name: "order", widget: "number", default: 0, required: false}

  - name: "recipes"
    label: "Recepten"
    folder: "content/recipes"
    create: true
    slug: "{{fields.title}}"
    identifier_field: title
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Hoofd Foto", name: "image", widget: "image", hint: "Hoofdfoto die op de overzichtspagina wordt getoond"}
      - {label: "Extra Foto's", name: "gallery", widget: "list", required: false, field: {label: "Foto", name: "photo", widget: "image"}, hint: "Optionele extra foto's voor in het recept"}
      - {label: "Aanbevolen Wijn", name: "wine", widget: "string"}
      - {label: "Korte Beschrijving", name: "description", widget: "text"}
      - {label: "Ingrediënten", name: "ingredients", widget: "list"}
      - {label: "Bereidingswijze", name: "steps", widget: "list"}

  - name: "locations"
    label: "Wijnlocaties"
    folder: "content/locations"
    create: true
    slug: "{{fields.name}}"
    identifier_field: name
    fields:
      - {label: "Naam", name: "name", widget: "string"}
      - {label: "Type", name: "type", widget: "select", options: ["wijnbar", "wijnwinkel", "wijnhuis", "restaurant"]}
      - {label: "Adres", name: "address", widget: "string", hint: "Volledig adres inclusief plaats en land voor beste resultaten"}
      - {label: "Latitude", name: "lat", widget: "number", value_type: "float", required: false, hint: "Wordt automatisch ingevuld op basis van adres (optioneel handmatig aanpassen)"}
      - {label: "Longitude", name: "lng", widget: "number", value_type: "float", required: false, hint: "Wordt automatisch ingevuld op basis van adres (optioneel handmatig aanpassen)"}
      - {label: "Beschrijving", name: "description", widget: "text"}
      - {label: "Hoofd Foto", name: "image", widget: "image", hint: "Hoofdfoto"}
      - {label: "Extra Foto's", name: "gallery", widget: "list", required: false, field: {label: "Foto", name: "photo", widget: "image"}, hint: "Optionele extra foto's"}
      - {label: "Website", name: "website", widget: "string", required: false}