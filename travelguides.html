<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>Wijnreisgidsen | de_wijnparade</title>
    <meta name="description" content="Ontdek de beste wijnregio's van Europa per land, gesorteerd op afstand vanuit Utrecht.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <style>
        .page-title { font-size: 1.75rem; font-weight: 700; color: var(--navy); margin-bottom: 0.4rem; }
        .page-subtitle { color: var(--gray-600); font-size: 0.95rem; margin-bottom: 1.5rem; }

        .filters-bar {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1rem 1.25rem;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            align-items: flex-end;
        }
        .filter-item { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 140px; }
        .filter-item label { font-size: 0.8rem; font-weight: 500; color: var(--gray-900); }
        .filter-item select {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            background: var(--white);
            color: var(--gray-900);
        }
        .filter-item select:focus { outline: none; border-color: var(--navy); }

        .country-group { margin-bottom: 2.5rem; }
        .country-heading {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-600);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--gray-200);
        }
        .country-regions { display: flex; flex-direction: column; }

        .region-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--gray-200);
        }
        .region-row-left { flex: 1; min-width: 0; }
        .region-row-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
        .region-row-emoji { font-size: 1.4rem; flex-shrink: 0; }
        .region-row-name { font-weight: 600; font-size: 1rem; color: var(--navy); }
        .region-row-meta { font-size: 0.78rem; color: var(--gray-600); margin-top: 0.1rem; }
        .region-row-intro { font-size: 0.875rem; line-height: 1.65; color: var(--gray-900); margin: 0; }

        .region-row-actions { display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }
        .region-btn-primary {
            display: block; padding: 0.45rem 1rem;
            background: var(--navy); color: #fff;
            border-radius: 7px; font-size: 0.83rem; font-weight: 500;
            text-decoration: none; text-align: center; white-space: nowrap;
            transition: background 0.2s;
        }
        .region-btn-primary:hover { background: #1e40af; }
        .region-btn-map {
            display: block; padding: 0.45rem 1rem;
            background: var(--gray-50); color: var(--gray-900);
            border: 1px solid var(--gray-200); border-radius: 7px;
            font-size: 0.83rem; font-weight: 500;
            text-decoration: none; text-align: center; white-space: nowrap;
            transition: all 0.2s;
        }
        .region-btn-map:hover { background: var(--gray-100); }

        @media (max-width: 600px) {
            .region-row { flex-direction: column; gap: 0.75rem; }
            .region-row-actions { flex-direction: row; }
            .filters-bar { gap: 0.5rem; }
        }
    </style>
</head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-57CJ2STYT6"></script>

<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="instagram-profile-link">
                <img src="/profile-photo.jpg" alt="de_wijnparade" class="profile-photo-img">
                <span>← Terug naar home</span>
            </a>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1 class="page-title">🌍 Wijnreisgidsen</h1>
            <p class="page-subtitle">De beste wijnhuizen, restaurants en wijnbars per regio.</p>

            <div class="filters-bar">
                <div class="filter-item">
                    <label for="filterCountry">Land</label>
                    <select id="filterCountry">
                        <option value="">Alle landen</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="filterDistance">Max. afstand vanuit Utrecht</label>
                    <select id="filterDistance">
                        <option value="">Alle afstanden</option>
                        <option value="500">≤ 500 km</option>
                        <option value="1000">≤ 1.000 km</option>
                        <option value="1500">≤ 1.500 km</option>
                        <option value="2000">≤ 2.000 km</option>
                    </select>
                </div>
            </div>

            <div id="regionsList"></div>
        </div>
    </main>

    <section class="tips-form-section">
        <div class="container">
            <div class="instagram-follow">
                <a href="https://www.instagram.com/de_wijnparade/" target="_blank" class="instagram-link">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                    <span>Volg de_wijnparade op Instagram</span>
                </a>
            </div>
            <h2 class="form-title">💡 Geef je tips door!</h2>
            <p class="form-intro">Ken jij een geweldige wijn of locatie? Deel het met ons!</p>
            <form name="tips" method="POST" data-netlify="true" class="tips-form" action="/bedankt.html">
                <input type="hidden" name="form-name" value="tips">
                <div class="form-group">
                    <label for="tip">Jouw tip</label>
                    <textarea id="tip" name="tip" rows="4" required placeholder="Vertel ons over je tip..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Naam</label>
                        <input type="text" id="name" name="name" required placeholder="Je naam">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="je@email.nl">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Versturen</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 de_wijnparade | <a href="https://www.instagram.com/de_wijnparade/" target="_blank">@de_wijnparade</a></p>
        </div>
    </footer>

    <script src="travelguides.js"></script>
</body>
</html>
