<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>Gerechten & Wijn | de_wijnparade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .pairings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .pairing-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .pairing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.1);
            border-color: var(--navy);
        }

        .pairing-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--gray-100);
        }

        .pairing-content {
            padding: 1.5rem;
        }

        .pairing-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .pairing-wine {
            font-size: 0.9rem;
            color: var(--gray-600);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pairing-description {
            font-size: 0.95rem;
            color: var(--gray-900);
            line-height: 1.6;
        }

        .read-more {
            display: inline-block;
            margin-top: 1rem;
            color: var(--navy);
            font-weight: 500;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .pairings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="instagram-profile-link">
                <img src="/profile-photo.jpg" alt="de_wijnparade" class="profile-photo-img">
                <span>← Terug naar home</span>
            </a>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="pairings-grid" id="pairingsContainer">
                <!-- Content wordt dynamisch geladen uit het CMS -->
            </div>
        </div>
    </main>

    <section class="tips-form-section">
        <div class="container">
            <h2 class="form-title">💡 Geef je tips door!</h2>
            <p class="form-intro">Ken jij een geweldige wijn of locatie? Deel het met ons!</p>
            <form name="tips" method="POST" data-netlify="true" class="tips-form">
                <input type="hidden" name="form-name" value="tips">
                <div class="form-group">
                    <label for="tip">Jouw tip</label>
                    <textarea id="tip" name="tip" rows="4" required placeholder="Vertel ons over je tip..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Naam</label>
                        <input type="text" id="name" name="name" required placeholder="Je naam">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="je@email.nl">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Versturen</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 de_wijnparade | <a href="https://www.instagram.com/de_wijnparade/" target="_blank">@de_wijnparade</a></p>
        </div>
    </footer>

    <script src="pairings.js"></script>
</body>
</html>
