<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>Toplijsten per gebied | de_wijnparade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">de_wijnparade</h1>
            <a href="index.html" class="instagram-link">← Terug naar home</a>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h2 class="section-title">📍 Toplijsten per gebied</h2>
            <p class="section-intro">Ontdek de beste wijnen per regio</p>

            <div class="link-list" id="toplistsContainer">
                <!-- Content will be dynamically loaded from CMS -->
                <!-- Example items: -->
                <a href="https://docs.google.com/spreadsheets/d/example" target="_blank" class="list-link">
                    <span class="link-icon">🇫🇷</span>
                    <span class="link-text">Bordeaux Toplijst 2025</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="/rioja2025.pdf" target="_blank" class="list-link">
                    <span class="link-icon">🇪🇸</span>
                    <span class="link-text">Rioja Koopgids</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="https://docs.google.com/spreadsheets/d/example2" target="_blank" class="list-link">
                    <span class="link-icon">🇮🇹</span>
                    <span class="link-text">Piemonte Selectie</span>
                    <span class="link-arrow">→</span>
                </a>
            </div>
        </div>
    </main>

    <section class="tips-form-section">
        <div class="container">
            <h2 class="form-title">💡 Geef je tips door!</h2>
            <p class="form-intro">Ken jij een geweldige wijn of locatie? Deel het met ons!</p>
            <form name="tips" method="POST" data-netlify="true" class="tips-form">
                <input type="hidden" name="form-name" value="tips">
                <div class="form-group">
                    <label for="tip">Jouw tip</label>
                    <textarea id="tip" name="tip" rows="4" required placeholder="Vertel ons over je tip..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Naam</label>
                        <input type="text" id="name" name="name" required placeholder="Je naam">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="je@email.nl">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Versturen</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 de_wijnparade | <a href="https://www.instagram.com/de_wijnparade/" target="_blank">@de_wijnparade</a></p>
        </div>
    </footer>

    <script src="toplists.js"></script>
</body>
</html>
