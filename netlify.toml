[build]
  publish = "."
  command = "bash build.sh"

[build.environment]
  NODE_VERSION = "18"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# Cache static assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache content indexes (short cache so updates show quickly)
[[headers]]
  for = "/content/*/_index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
