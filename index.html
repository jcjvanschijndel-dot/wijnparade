<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="de_wijnparade - Wijn tips, toplijsten en favorieten">
    <title>de_wijnparade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"></head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="https://www.instagram.com/de_wijnparade/" target="_blank" class="instagram-profile-link">
                <img src="/profile-photo.jpg" alt="de_wijnparade" class="profile-photo-img">
                <span>@de_wijnparade</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Navigatie kaartjes -->
            <div class="nav-grid">
                <a href="map.html" class="nav-card">
                    <span class="link-icon"><svg class="maps-pin" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#EA4335"/><circle cx="12" cy="9" r="2.5" fill="#B31412"/></svg></span>
                    <span class="link-text">Wijnkaart</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="value-score.html" class="nav-card">
                    <span class="link-icon">💰</span>
                    <span class="link-text">Value Score Overzicht</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="toplists.html" class="nav-card">
                    <span class="link-icon">🛒</span>
                    <span class="link-text">Koopgidsen</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="travelguides.html" class="nav-card">
                    <span class="link-icon">🌍</span>
                    <span class="link-text">Reisgidsen</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="wine-food.html" class="nav-card">
                    <span class="link-icon">🍽️</span>
                    <span class="link-text">Wijn & Eten Overzicht</span>
                    <span class="link-arrow">→</span>
                </a>
                <a href="shop.html" class="nav-card">
                    <span class="link-icon">🛒</span>
                    <span class="link-text">Wijnparade shop</span>
                    <span class="link-arrow">→</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Tips Form -->
    <section class="tips-form-section">
        <div class="container">
            <h2 class="form-title">💡 Geef je tips door!</h2>
            <p class="form-intro">Ken jij een geweldige wijn of locatie? Deel het met ons!</p>
            <form name="tips" method="POST" data-netlify="true" class="tips-form" action="/bedankt.html">
                <input type="hidden" name="form-name" value="tips">
                <div class="form-group">
                    <label for="tip">Jouw tip</label>
                    <textarea id="tip" name="tip" rows="4" required placeholder="Vertel ons over je tip..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Naam</label>
                        <input type="text" id="name" name="name" required placeholder="Je naam">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="je@email.nl">
                    </div>
                </div>
                <button type="submit" class="submit-btn">Versturen</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 de_wijnparade | <a href="https://www.instagram.com/de_wijnparade/" target="_blank">@de_wijnparade</a></p>
        </div>
    </footer>

    <script src="home.js"></script>
</body>
</html>
